sonar.projectKey=fortress-upi
sonar.projectName=Fortress
sonar.sourceEncoding=UTF-8

sonar.sources=services,shared,apps/mobile/android
sonar.tests=services,shared,apps/mobile/android
sonar.test.inclusions=**/*_test.go,**/src/test/**,**/src/androidTest/**
sonar.exclusions=**/*_test.go,**/src/test/**,**/src/androidTest/**,**/build/**,**/internal/testkit/**,**/cmd/genfixture/**

sonar.go.coverage.reportPaths=coverage/**/coverage.out

# Quality gate (configured server-side, enforced by -Dsonar.qualitygate.wait):
#   new code: 0 bugs, 0 vulnerabilities, 100% security hotspots reviewed,
#   coverage >= 80%, duplication <= 3%, maintainability rating A.
