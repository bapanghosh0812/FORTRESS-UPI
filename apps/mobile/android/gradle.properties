org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── Public, non-secret build inputs (override per environment with -P) ──
# Signing keys, keystore passwords and API secrets NEVER go here; release
# signing happens in CI from an HSM-backed signing service / Play App Signing.
fortress.apiBaseUrl=https://api.fortress-upi.example
# Issuer PUBLIC keys pinned into the app: "kidHex:base64Spki;..."
fortress.issuerKeys=
# SHA-256 of the Play App Signing certificate (hex); empty disables the check.
fortress.expectedSignerSha256=
fortress.playCloudProjectNumber=0
