# Kong declarative config (decK). Tier-2 L7 ingress for the Fortress public API.
#   deck gateway diff infra/kong/kong.yaml && deck gateway sync infra/kong/kong.yaml
#
# Only security-gateway is exposed; every other service is mesh-internal.
# TLS terminates here (TLS 1.3 only, set in kong.conf: ssl_protocols = TLSv1.3).
_format_version: "3.0"
_transform: true

services:
  - name: security-gateway
    url: http://security-gateway.fortress-core.svc.cluster.local:8080
    connect_timeout: 1000
    read_timeout: 5000
    write_timeout: 5000
    # Money-moving calls are never blindly retried at the edge; clients retry
    # with the same idempotency key and the services deduplicate.
    retries: 0
    routes:
      - name: offline-settlements
        paths: ["~/v1/offline/settlements$"]
        methods: [POST]
        protocols: [https]
        strip_path: false
        https_redirect_status_code: 426
        request_buffering: true
        response_buffering: true
      - name: device-binding
        paths: ["~/v1/bind/(begin|complete)$"]
        methods: [POST]
        protocols: [https]
        strip_path: false
        https_redirect_status_code: 426
        plugins:
          # Binding is unauthenticated by design, so it gets the tightest budget.
          - name: rate-limiting
            instance_name: binding-per-ip
            config:
              minute: 6
              hour: 30
              limit_by: ip
              policy: redis
              fault_tolerant: true
              hide_client_headers: true
              redis:
                host: redis-ratelimit.fortress-data.svc.cluster.local
                port: 6379
                ssl: true
                ssl_verify: true
                timeout: 50
      - name: payments
        paths: ["~/v1/payments(/[A-Za-z0-9_-]+(/authorize)?)?$", "~/v1/(accounts|transactions|limits|profile)$"]
        methods: [GET, POST]
        protocols: [https]
        strip_path: false
        https_redirect_status_code: 426
      - name: directory-lookups
        paths: ["~/v1/directory/(vpa|mobile)/[^/]{1,300}$"]
        methods: [GET]
        protocols: [https]
        strip_path: false
        https_redirect_status_code: 426
        plugins:
          # A payee directory is an enumeration target: cap lookups per device.
          - name: rate-limiting
            instance_name: directory-per-device
            config:
              minute: 20
              hour: 120
              limit_by: header
              header_name: X-Fortress-Device
              policy: redis
              fault_tolerant: true
              hide_client_headers: true
              redis:
                host: redis-ratelimit.fortress-data.svc.cluster.local
                port: 6379
                ssl: true
                ssl_verify: true
                timeout: 50
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 64
          size_unit: kilobytes
          require_content_length: true
      # Per-device token bucket (device ID is verified downstream; an attacker
      # rotating IDs is still capped by the per-IP limit below).
      - name: rate-limiting
        instance_name: per-device
        config:
          second: 5
          minute: 120
          limit_by: header
          header_name: X-Fortress-Device
          policy: redis
          fault_tolerant: true
          hide_client_headers: true
          redis:
            host: redis-ratelimit.fortress-data.svc.cluster.local
            port: 6379
            ssl: true
            ssl_verify: true
            timeout: 50
      - name: rate-limiting
        instance_name: per-ip
        config:
          second: 50
          limit_by: ip
          policy: redis
          fault_tolerant: true
          hide_client_headers: true
          redis:
            host: redis-ratelimit.fortress-data.svc.cluster.local
            port: 6379
            ssl: true
            ssl_verify: true
            timeout: 50

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid#counter
      echo_downstream: true
  - name: bot-detection
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      upstream_health_metrics: true
  - name: response-transformer
    config:
      remove:
        headers: [Server, Via, X-Kong-Upstream-Latency, X-Kong-Proxy-Latency]
      add:
        headers:
          - "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload"
