# Fortress — zero-trust CI/CD pipeline
#
# Every gate is blocking. Nothing reaches the registry (and therefore staging,
# which deploys only cosign-verified digests via Argo CD + Kyverno) unless:
#   secrets ✔  SAST ✔  lint ✔  tests/race/coverage ✔  govulncheck ✔
#   IaC/Dockerfile policy ✔  image CVEs (HIGH/CRITICAL) ✔  SBOM ✔
#   micro-benchmark budgets ✔  k6 p99 < 15 ms ✔  SonarQube quality gate ✔
#
# Supply chain: every third-party action is pinned to a full commit SHA
# (tag in the trailing comment; Dependabot keeps them current). The default
# token is read-only; jobs opt in to the minimum extra scope they need.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.1"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GOVULNCHECK_VERSION: "v1.8.0"
  GOWORK: "off"
  GOTOOLCHAIN: "local"

jobs:
  # ───────────────────────────── 1. Secrets ─────────────────────────────
  secrets:
    name: secret-scan (trufflehog)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog (full history, verified + unknown)
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --results=verified,unknown --fail --exclude-paths=.trufflehog-exclude.txt

  # ───────────────────────────── 2. SAST ────────────────────────────────
  semgrep:
    name: sast (semgrep)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (registry packs + Fortress rules), fail on any ERROR/WARNING
        run: |
          semgrep scan --metrics=off --error \
            --severity=ERROR --severity=WARNING \
            --config p/default --config p/golang --config p/kotlin \
            --config p/dockerfile --config p/kubernetes --config p/secrets \
            --config .semgrep/ \
            --sarif --output semgrep.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ───────────────────────────── 3. Go ──────────────────────────────────
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - shared/crypto
          - shared/platform
          - services/core-ledger
          - services/identity
          - services/offline-mesh
          - services/payments
          - services/security-gateway
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: Module integrity
        run: go mod verify && go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: golangci-lint (gosec, staticcheck, errcheck, revive, …)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml --timeout=5m
      - name: Unit tests (race detector, shuffled) + coverage
        run: go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage gate (>= 80% of business-logic statements)
        # Gate applies to domain/app/devicesig and shared packages. Composition
        # roots (cmd/) and I/O adapters are covered by the container + k6 stage.
        run: |
          pct=$(awk 'NR > 1 && $1 ~ /(\/internal\/(domain|app|devicesig)\/|\/shared\/(crypto|platform)\/)/ {
                   split($0, f, " "); total += f[2]; if (f[3] > 0) covered += f[2] }
                 END { printf "%.1f", total ? 100 * covered / total : 100 }' coverage.out)
          echo "business-logic coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p >= 80.0) ? 0 : 1 }' || { echo "::error::coverage ${pct}% < 80%"; exit 1; }
      - name: Fuzz smoke (30 s per target, crypto codec only)
        if: matrix.module == 'shared/crypto'
        run: go test ./fce -run '^$' -fuzz FuzzDecode -fuzztime 30s
      - name: govulncheck (reachable CVEs in stdlib + deps)
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...
      - name: Sanitize artifact name
        id: name
        run: echo "slug=$(echo '${{ matrix.module }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ steps.name.outputs.slug }}
          path: ${{ matrix.module }}/coverage.out
          retention-days: 7

  # ───────────────────────────── 4. Performance budgets ─────────────────
  bench:
    name: perf-gate (go benchmarks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Benchmarks vs perf/budgets.txt
        run: bash scripts/perf-gate.sh

  # ───────────────────────────── 5. Android ─────────────────────────────
  android:
    name: android (lint + unit tests + R8 release build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.0"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Android Lint (warnings as errors), unit tests, minified release
        run: gradle --no-daemon --stacktrace lintRelease testReleaseUnitTest :app:assembleRelease

  # ───────────────────────────── 6. IaC & Dockerfile policy ─────────────
  iac:
    name: iac (checkov + hadolint)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/docker/go-service.Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning
      - name: Checkov (Kubernetes manifests + Dockerfiles)
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: .
          framework: kubernetes,dockerfile,github_actions
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ───────────────────────────── 7. Container ───────────────────────────
  container:
    name: image (${{ matrix.service }})
    needs: [secrets, semgrep, go, iac]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [core-ledger, identity, offline-mesh, payments, security-gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (distroless, non-root)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/go-service.Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          tags: fortress/${{ matrix.service }}:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Assert non-root + no shell
        run: |
          user=$(docker image inspect fortress/${{ matrix.service }}:ci --format '{{.Config.User}}')
          [ "$user" = "65532:65532" ] || { echo "::error::image user is '$user'"; exit 1; }
          if docker run --rm --entrypoint /bin/sh fortress/${{ matrix.service }}:ci -c true 2>/dev/null; then
            echo "::error::image contains a shell"; exit 1
          fi
      - name: Trivy (OS + library CVEs, misconfig, secrets) — fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fortress/${{ matrix.service }}:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: fortress/${{ matrix.service }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}.spdx.json

      # ── Load-test gate (offline-mesh): p99 < 15 ms on the settlement path ──
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.service == 'offline-mesh'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Start hardened container with an ephemeral signed fixture
        if: matrix.service == 'offline-mesh'
        run: |
          (cd services/offline-mesh && go run ./cmd/genfixture) > fixture.json
          echo "BUNDLE_B64=$(jq -r .bundleB64 fixture.json)" >> "$GITHUB_ENV"
          docker run -d --name svc -p 8080:8080 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 512m --cpus 2 \
            -e ISSUER_KEYS="$(jq -r .issuerKeys fixture.json)" \
            fortress/offline-mesh:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8080/readyz && break; sleep 1; done
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        if: matrix.service == 'offline-mesh'
      - name: k6 (thresholds enforce p99 < 15 ms, error rate < 0.1%)
        if: matrix.service == 'offline-mesh'
        run: k6 run --quiet perf/k6/offline-mesh-smoke.js
      - name: Container logs on failure
        if: failure() && matrix.service == 'offline-mesh'
        run: docker logs svc || true

  # ───────────────────────────── 8. Quality gate ────────────────────────
  sonarqube:
    name: sonarqube quality gate
    needs: [go]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage
      - name: SonarQube scan — waits for and enforces the quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  # ───────────────────────────── 9. Release (main only) ────────────────
  release:
    name: publish + sign (${{ matrix.service }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [container, bench, android, sonarqube]
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign via GitHub OIDC
    strategy:
      matrix:
        service: [core-ledger, identity, offline-mesh, payments, security-gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (SLSA provenance + SBOM attestations)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/go-service.Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/fortress-${{ matrix.service }}:${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Cosign keyless sign (by digest, never by tag)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fortress-${{ matrix.service }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
